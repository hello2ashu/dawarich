services:
  # Old standalone "dawarich_redis" service removed — Dawarich now uses the
  # shared_redis container from deploy-shared-postgres.yaml, on logical DB 0.
  # Requires joining the "shared-postgres_net" external network.

  dawarich_db:
    image: postgis/postgis:17-3.6-alpine
    container_name: Dawarich-DB
    hostname: dawarich_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dawarich_development"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - /volume1/docker/dawarich/db:/var/lib/postgresql/data:rw
      - /volume1/docker/dawarich/shared:/var/shared:rw
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${dawarichdbpassword}
      POSTGRES_DB: dawarich_development
      TIME_ZONE: America/Los_Angeles
    shm_size: 1G
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    restart: on-failure:5

  dawarich_app:
    image: freikin/dawarich:latest
    container_name: Dawarich
    volumes:
      - /volume1/docker/dawarich/public:/var/app/public:rw
      - /volume1/docker/dawarich/watched:/var/app/tmp/imports/watched:rw
      - /volume1/docker/dawarich/storage:/var/app/storage:rw
    ports:
      - 3639:3000
    stdin_open: true
    tty: true
    entrypoint: web-entrypoint.sh
    command: ['bin/rails', 'server', '-p', '3000', '-b', '::']
    environment:
      RAILS_ENV: development
      REDIS_URL: redis://Shared-Redis:6379/0
      DATABASE_HOST: dawarich_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${dawarichdbpassword}
      DATABASE_NAME: dawarich_development
      SELF_HOSTED: true
      STORE_GEODATA: true
      SECRET_KEY_BASE: ${dawarichsecretkeybase}
      APPLICATION_HOSTS: dawarich.ashish-syn-nas.synology.me
      MIN_MINUTES_SPENT_IN_CITY: 60
      TIME_ZONE: America/Los_Angeles
      DISTANCE_UNIT: km
      PROMETHEUS_EXPORTER_ENABLED: false
      PROMETHEUS_EXPORTER_HOST: 0.0.0.0
      PROMETHEUS_EXPORTER_PORT: 9394
      ENABLE_TELEMETRY: false # More on telemetry: https://dawarich.app/docs/tutorials/telemetry
      APPLICATION_PROTOCOL: http
      PHOTON_API_HOST: app.chibigeo.com/v1/photon
      PHOTON_API_KEY: ${photonapikey}
      PHOTON_API_USE_HTTPS: true
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO - http://127.0.0.1:3000/api/v1/health | grep -q '\"status\"\\s*:\\s*\"ok\"'"]
      interval: 10s
      retries: 30
      start_period: 30s
      timeout: 10s
    mem_limit: 512m
    depends_on:
      dawarich_db:
        condition: service_healthy
    networks:
      - default
      - shared-postgres_net
    restart: on-failure:5

  dawarich_sidekiq:
    image: freikin/dawarich:latest
    container_name: Dawarich-SIDEKIQ
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f sidekiq"]
      interval: 10s
      retries: 30
      start_period: 30s
      timeout: 10s
    volumes:
      - /volume1/docker/dawarich/public:/var/app/public:rw
      - /volume1/docker/dawarich/watched:/var/app/tmp/imports/watched:rw
      - /volume1/docker/dawarich/storage:/var/app/storage:rw
    stdin_open: true
    tty: true
    entrypoint: sidekiq-entrypoint.sh
    command: ['sidekiq']
    environment:
      RAILS_ENV: development
      REDIS_URL: redis://shared_redis:6379/0
      DATABASE_HOST: dawarich_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${dawarichdbpassword}
      DATABASE_NAME: dawarich_development
      SECRET_KEY_BASE: ${dawarichsecretkeybase}
      APPLICATION_HOSTS: dawarich.ashish-syn-nas.synology.me,192.168.189.1,localhost,192.168.189.40,192.168.189.41
      BACKGROUND_PROCESSING_CONCURRENCY: 10
      PROMETHEUS_EXPORTER_ENABLED: false
      PROMETHEUS_EXPORTER_HOST: dawarich_app
      PROMETHEUS_EXPORTER_PORT: 9394
      SELF_HOSTED: true
      STORE_GEODATA: true
      APPLICATION_PROTOCOL: http
      PHOTON_API_HOST: app.chibigeo.com/v1/photon
      PHOTON_API_KEY: ${dawarichphoton}
      PHOTON_API_USE_HTTPS: true
      TIME_ZONE: America/Los_Angeles
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    mem_limit: 512m
    depends_on:
      dawarich_db:
        condition: service_healthy
      dawarich_app:
        condition: service_healthy
    networks:
      - default
      - shared-postgres_net
    restart: on-failure:5

networks:
  shared-postgres_net:
    external: true
